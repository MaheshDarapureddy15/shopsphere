<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopSphere | Account Access</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .auth-wrapper {
      max-width: 420px;
      margin: 4rem auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .auth-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.75rem;
    }
    .auth-tab {
      flex: 1;
      padding: 0.6rem;
      border: none;
      background: #f1f5f9;
      color: #334155;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .auth-tab.active {
      background: #2563eb;
      color: #ffffff;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: #1e293b;
    }
    .form-group input {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .btn-primary-full {
      width: 100%;
      padding: 0.75rem;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-primary-full:hover {
      background: #1d4ed8;
    }
    .auth-alert {
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .auth-alert.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }
    .auth-alert.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="./index.html" class="logo">ShopSphere</a>
      <nav class="nav-links">
        <a href="./index.html">Back to Store</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-tabs">
        <button type="button" id="tab-login" class="auth-tab active">Login</button>
        <button type="button" id="tab-register" class="auth-tab">Register</button>
      </div>

      <div id="auth-alert" class="auth-alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="mahesh@shopsphere.com" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required />
        </div>
        <div class="auth-form-links">
          <button type="button" id="forgot-password-link" class="auth-text-link">Forgot password?</button>
          <button type="button" id="reset-password-link" class="auth-text-link">Reset password</button>
        </div>
        <button type="submit" class="btn-primary-full">Sign In</button>
      </form>

      <form id="register-form" class="hidden">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="Mahesh Darapureddy" required />
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="reg-phone">Phone (Optional)</label>
          <input type="tel" id="reg-phone" placeholder="9876543210" />
        </div>
        <div class="form-group">
          <label for="reg-password">Password (min 6 characters)</label>
          <input type="password" id="reg-password" minlength="6" placeholder="Create a password" required />
        </div>
        <button type="submit" class="btn-primary-full">Create Account</button>
      </form>

      <form id="forgot-password-form" class="hidden">
        <h2 class="auth-panel-title">Forgot password?</h2>
        <p class="auth-panel-copy">Enter your email and we'll generate a secure reset token for local testing.</p>
        <div class="form-group">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" placeholder="you@example.com" required />
        </div>
        <button type="submit" class="btn-primary-full">Generate Reset Token</button>
        <button type="button" id="back-to-login" class="auth-secondary-link">Back to Login</button>
      </form>

      <form id="reset-password-form" class="hidden">
        <h2 class="auth-panel-title">Reset password</h2>
        <p class="auth-panel-copy">Enter the reset token and choose a new password.</p>
        <div class="form-group">
          <label for="reset-token">Reset Token</label>
          <input type="text" id="reset-token" placeholder="Paste your reset token" required />
        </div>
        <div class="form-group">
          <label for="reset-new-password">New Password</label>
          <input type="password" id="reset-new-password" minlength="6" placeholder="Minimum 6 characters" required />
        </div>
        <div class="form-group">
          <label for="reset-confirm-password">Confirm Password</label>
          <input type="password" id="reset-confirm-password" minlength="6" placeholder="Confirm new password" required />
        </div>
        <button type="submit" class="btn-primary-full">Update Password</button>
        <button type="button" id="reset-back-to-login" class="auth-secondary-link">Back to Login</button>
      </form>
    </div>
  </main>

  <script src="./shared/api.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
